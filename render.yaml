services:
  # ---------------------------------------------
  # 1. API BACKEND (Laravel 12 + Docker + Aiven MySQL)
  # ---------------------------------------------
  - type: web
    name: study-center-api
    runtime: docker
    rootDir: backend
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: StudyCenter
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: mysql-4ee79c3-azizbeji32-1336.e.aivencloud.com
      - key: DB_PORT
        value: "21609"
      - key: DB_DATABASE
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        value: AVNS_DxCbUyb6QYdoYDCBSQE
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: MYSQL_ATTR_SSL_VERIFY_SERVER_CERT
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash

  # ---------------------------------------------
  # 2. FRONTEND (Vue 3 + Vite Static Site)
  # ---------------------------------------------
  - type: web
    name: study-center-client
    runtime: static
    buildCommand: npm install && npx vite build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://study-center-api.onrender.com

