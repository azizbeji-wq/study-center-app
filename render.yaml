services:
  # ---------------------------------------------
  # 1. API BACKEND (Laravel 12 + Docker + TiDB)
  # ---------------------------------------------
  - type: web
    name: study-center-api
    runtime: docker
    rootDir: backend
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: StudyCenter
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: gateway01.eu-central-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: study_center
      - key: DB_USERNAME
        value: qr9m6YrkdD6p9dT.root
      - key: DB_PASSWORD
        value: MyGnC9OcPZqSWlbA
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: MYSQL_ATTR_SSL_VERIFY_SERVER_CERT
        value: "false"
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: APP_KEY
        generateValue: true
     

  # ---------------------------------------------
  # 2. FRONTEND (Vue 3 + Vite Static Site)
  # ---------------------------------------------
  - type: web
    name: study-center-client
    runtime: static
    buildCommand: npm install && npx vite build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://study-center-api.onrender.com